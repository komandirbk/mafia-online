<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мафия Онлайн</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  :root {
    --bg:#12100e; --surface:#1d1a17; --elevated:#282420; --text:#f0ead9;
    --muted:#9c937f; --gold:#d4af37; --accent:#b3382e; --green:#32b071; --divider:#3a352e;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,"SF Pro Text",Segoe UI,sans-serif; min-height:100vh; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px; }
  h1 { font-family:Georgia,serif; color:var(--gold); font-size:30px; text-align:center; margin:24px 0 6px; }
  .tagline { text-align:center; color:var(--muted); font-size:14px; margin-bottom:28px; }
  .card { background:var(--surface); border:1px solid var(--divider); border-radius:16px; padding:20px; margin-bottom:14px; }
  .home { max-width:400px; margin:0 auto; }
  input, select { width:100%; padding:12px 14px; margin-bottom:10px; background:var(--elevated); border:1px solid var(--divider); border-radius:10px; color:var(--text); font-size:16px; }
  input::placeholder { color:var(--muted); }
  button { background:var(--gold); color:#1d1a17; border:0; border-radius:10px; padding:12px 18px; font-weight:700; cursor:pointer; font-size:15px; width:100%; }
  button.ghost { background:var(--elevated); color:var(--muted); border:1px solid var(--divider); }
  button.danger { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:10px; }
  .err { color:var(--accent); font-size:13px; min-height:18px; margin-bottom:6px; text-align:center; }
  .divider { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:16px 0; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--divider); }
  #roomView { display:none; }
  .room-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .code-pill { font-family:Georgia,serif; font-size:24px; letter-spacing:.35em; color:var(--gold); background:var(--surface); border:1px dashed var(--gold); border-radius:12px; padding:6px 14px 6px 20px; cursor:pointer; user-select:none; }
  .code-pill.hidden-code { letter-spacing:.15em; font-size:15px; color:var(--muted); border-color:var(--divider); font-family:inherit; padding:10px 14px; }
  .settings { margin-bottom:14px; }
  .settings summary { cursor:pointer; color:var(--gold); font-weight:700; padding:6px 0; list-style:none; }
  .settings summary::-webkit-details-marker { display:none; }
  .preset-row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .preset-btn { background:var(--elevated); color:var(--muted); border:1px solid var(--divider); border-radius:99px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; width:auto; }
  .preset-btn.on { background:var(--gold); color:#1d1a17; border-color:var(--gold); }
  .set-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px 16px; margin-top:8px; }
  .set-grid label { font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .set-grid input[type=number] { width:80px; margin:0; padding:6px 8px; font-size:14px; }
  .set-grid input[type=checkbox] { width:auto; margin:0; accent-color:var(--gold); }
  .set-grid select { margin:0; padding:6px 8px; font-size:13px; width:auto; flex:1; }
  .comp-preview { margin-top:10px; padding:10px 12px; background:var(--elevated); border-radius:10px; font-size:13px; color:var(--text); }
  .settings-ro { font-size:13px; color:var(--muted); padding:8px 0; }
  .icon-btn { width:auto; background:var(--elevated); color:var(--muted); border:1px solid var(--divider); padding:8px 12px; }
  .mode-tag { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); background:var(--elevated); border-radius:99px; padding:4px 10px; }
  .players { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
  .tile { position:relative; background:var(--elevated); border:2px solid var(--divider); border-radius:14px; aspect-ratio:4/3; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .tile video { width:100%; height:100%; object-fit:cover; }
  .tile .ph { font-family:Georgia,serif; font-size:38px; color:var(--gold); opacity:.7; }
  .tile .name { position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.6); border-radius:8px; padding:3px 9px; font-size:13px; font-weight:600; z-index:3; }
  .tile .name .crown { color:var(--gold); }
  .tile .badges { position:absolute; top:6px; left:6px; right:6px; display:flex; gap:4px; flex-wrap:wrap; z-index:3; }
  .badge { font-size:11px; font-weight:700; border-radius:99px; padding:2px 8px; background:rgba(0,0,0,.65); }
  .badge.nom { color:#ffb454; border:1px solid #ffb454; }
  .badge.vote { color:var(--green); border:1px solid var(--green); }
  .badge.mafi { color:var(--accent); border:1px solid var(--accent); }
  .tile.clickable { cursor:pointer; }
  .tile.clickable:hover { border-color:var(--gold); }
  .tile.candidate { border-color:#ffb454; }
  .tile.dead::after { content:"☠"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:52px; background:rgba(10,8,6,.72); z-index:2; }
  .tile.me { border-color:var(--gold); }
  .hint { color:var(--muted); font-size:13px; text-align:center; padding:10px; }
  .toolbar { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .toolbar button { width:auto; flex:1; min-width:150px; }
  #gamePanel { display:none; text-align:center; margin-bottom:12px; }
  .phase-title { font-family:Georgia,serif; font-size:24px; color:var(--gold); }
  .phase-sub { color:var(--muted); font-size:14px; margin-top:2px; min-height:20px; }
  .timer { font-variant-numeric:tabular-nums; font-size:20px; font-weight:700; color:var(--text); margin-top:4px; }
  .timer.low { color:var(--accent); }
  .overlay { position:fixed; inset:0; background:rgba(10,8,6,.88); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay .card { max-width:420px; width:100%; text-align:center; }
  .role-big { font-size:60px; margin:6px 0; }
  .role-name { font-family:Georgia,serif; font-size:30px; color:var(--gold); margin-bottom:6px; }
  .role-desc { color:var(--muted); font-size:14px; margin-bottom:14px; }
  .team-list { text-align:left; background:var(--elevated); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:14px; }
  .deaths { text-align:left; background:var(--elevated); border-radius:10px; padding:10px 14px; margin:10px 0; font-size:14px; }
  .deaths .d { color:var(--accent); font-weight:600; }
  .checkres { margin:8px 0; font-weight:700; }
  .black { color:var(--accent); } .red { color:var(--green); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎩 Мафия Онлайн</h1>
  <div class="tagline">город засыпает — а вы подключаетесь</div>

  <div id="authView" class="home card">
    <div class="err" id="authErr"></div>
    <div class="preset-row" style="justify-content:center">
      <button class="preset-btn on" id="tabLogin" onclick="authTab('login')">Вход</button>
      <button class="preset-btn" id="tabReg" onclick="authTab('reg')">Регистрация</button>
    </div>
    <input id="authEmail" type="email" placeholder="Почта" autocomplete="email">
    <input id="authPass" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
    <input id="authNick" maxlength="24" placeholder="Никнейм в игре" autocomplete="nickname" style="display:none">
    <button onclick="doAuth()" id="authBtn">Войти</button>
    <div class="divider">или</div>
    <button class="ghost" onclick="googleAuth()">Войти через Google</button>
    <div class="hint" style="padding-top:12px">Аккаунт нужен, чтобы ник и статистика сохранялись между играми.</div>
  </div>

  <div id="homeView" class="home card" style="display:none">
    <div class="err" id="homeErr"></div>
    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:12px">
      <div>Ты: <b id="meNick" style="color:var(--gold)"></b></div>
      <div class="row" style="gap:6px">
        <button class="icon-btn" onclick="changeNick()" title="Сменить ник">✏️</button>
        <button class="icon-btn" onclick="signOut()" title="Выйти из аккаунта">Выйти</button>
      </div>
    </div>
    <input id="nickname" type="hidden">
    <div id="joinBlock">
      <input id="joinCode" maxlength="6" placeholder="Код комнаты (6 символов)" style="text-transform:uppercase">
      <button onclick="join()">Войти в комнату</button>
    </div>
    <div class="divider">или</div>
    <select id="mode">
      <option value="auto">Автоведущий — играют все</option>
      <option value="host">Живой ведущий — я веду игру</option>
    </select>
    <button class="ghost" onclick="create()">Создать комнату</button>
  </div>

  <div id="roomView">
    <div class="card">
      <div class="room-head">
        <div class="code-pill hidden-code" id="roomCode" onclick="toggleCode()" title="Показать / скрыть код">👁 показать код</div>
        <span class="mode-tag" id="roomMode"></span>
        <div class="row" style="flex:1; justify-content:flex-end; min-width:200px;">
          <button class="icon-btn" onclick="toggleSound()" id="soundBtn" title="Звуки">🔊</button>
          <button class="ghost" style="width:auto" onclick="copyLink()" id="copyBtn">Пригласить</button>
          <button class="danger" style="width:auto" onclick="leave()">Выйти</button>
        </div>
      </div>

      <details class="settings card" id="settingsBox" style="display:none">
        <summary>⚙️ Настройки игры <span id="presetName"></span></summary>
        <div id="settingsHost">
          <div class="preset-row" id="presetRow"></div>
          <div class="set-grid" id="setGrid"></div>
          <div class="comp-preview" id="compPreview"></div>
        </div>
        <div class="settings-ro" id="settingsRO" style="display:none"></div>
      </details>
      <div id="gamePanel">
        <div class="phase-title" id="phaseTitle"></div>
        <div class="phase-sub" id="phaseSub"></div>
        <div class="timer" id="timer"></div>
      </div>
      <div class="players" id="playersGrid"></div>
      <div class="hint" id="videoHint"></div>
      <div class="toolbar" id="toolbar">
        <button id="botBtn" class="ghost" style="display:none" onclick="addBot()">🤖 Добавить бота</button>
        <button id="startBtn" style="display:none" onclick="startGame()">Начать игру</button>
        <button id="readyBtn" style="display:none" onclick="sendReady()">Готов</button>
        <button id="hostNextBtn" style="display:none" onclick="hostNext()">Следующая фаза →</button>
        <button id="donModeBtn" class="ghost" style="display:none" onclick="toggleDonMode()"></button>
        <button id="airShotBtn" class="ghost" style="display:none" onclick="airShot()">💨 Выстрел в воздух</button>
        <button id="raiseYesBtn" style="display:none" onclick="raise(true)">✋ Поднять руку — за</button>
        <button id="raiseNoBtn" class="ghost" style="display:none" onclick="raise(false)">Против</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="roleOverlay">
  <div class="card">
    <div>Твоя роль</div>
    <div class="role-big" id="roleEmoji"></div>
    <div class="role-name" id="roleName"></div>
    <div class="role-desc" id="roleDesc"></div>
    <div class="team-list" id="teamList" style="display:none"></div>
    <button onclick="closeRole()">Понял, готов играть</button>
  </div>
</div>

<div class="overlay" id="endOverlay">
  <div class="card">
    <div class="role-big" id="endEmoji"></div>
    <div class="role-name" id="endTitle"></div>
    <div class="team-list" id="endRoles"></div>
    <button onclick="location.href=location.pathname">В новое лобби</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ktypybmjiwaltdokdmqm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QNh7vPkGwnLd-2xxaW--vQ_c3ehx8rN";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ROLE_RU = {
  civilian:["Мирный житель","🧑‍🌾","Днём ищи мафию, голосуй мудро."],
  mafia:["Мафия","🔫","Ночью выбирай жертву вместе с командой. Днём не спались."],
  don:["Дон","🎩","Глава мафии: твой голос решает споры, ночью можешь искать шерифа."],
  sheriff:["Шериф","⭐","Каждую ночь проверяй одного игрока: чёрный или красный."],
  doctor:["Доктор","💉","Каждую ночь лечи одного игрока (нельзя одного и того же дважды подряд)."],
  maniac:["Маньяк","🔪","Играешь сам за себя: убивай по ночам, останься последним."],
  lover:["Любовница","💋","Ночью блокируй действия одного игрока."]
};
const PHASE_TITLE = {
  reveal:"Раздача ролей", zeronight:"Нулевая ночь", day:"День — обсуждение", voting:"Голосование",
  allraise:"Подъём всех", lastword:"Последнее слово", night:"Ночь", morning:"Утро", finished:"Игра окончена"
};

// Пресеты — 1в1 как встроенные в iOS-приложении
const PRESETS = {
  sport: { name:"Спортивная (ФИИМ)", kind:"sport", day_seconds_per_player:60, last_word_seconds:60,
    zero_night_seconds:60, night_step_seconds:25, tie:"revoteThenJointDeath", can_nominate_self:false,
    allow_mafia_skip_shot:false, skip_zero_night:false,
    roles:{don:true, sheriff:true, doctor:false, maniac:false, lover:false} },
  yard: { name:"Дворовая", kind:"yard", day_seconds_per_player:45, last_word_seconds:30,
    zero_night_seconds:30, night_step_seconds:30, tie:"revoteThenNobody", can_nominate_self:true,
    allow_mafia_skip_shot:true, skip_zero_night:false,
    roles:{don:true, sheriff:true, doctor:true, maniac:false, lover:false} },
  extended: { name:"Расширенная", kind:"extended", day_seconds_per_player:60, last_word_seconds:60,
    zero_night_seconds:60, night_step_seconds:30, tie:"revoteThenAllRaise", can_nominate_self:false,
    allow_mafia_skip_shot:true, skip_zero_night:false,
    roles:{don:true, sheriff:true, doctor:true, maniac:true, lover:false} }
};
const TIE_RU = { revoteThenNobody:"переголосовка, затем никто не выбывает",
  revoteThenJointDeath:"переголосовка, затем оба выбывают",
  revoteThenAllRaise:"переголосовка, затем подъём всех" };
const ROLE_SHORT = { don:"дон", mafia:"мафия", sheriff:"шериф", doctor:"доктор",
  maniac:"маньяк", lover:"любовница", civilian:"мирный" };

let me=null, room=null, players=[], channel=null;
let lk={room:null,connected:false};
let game=null, myRole=null, seatsG=[], mafiaMarks={}, donMode="kill", roleShown=false;
let tickTimer=null, clockTimer=null, myActions={}, hostRoles={};
let codeShown=false, preset=null, soundOn=localStorage.getItem("sound") !== "off", lastDeaths=0;

const $=id=>document.getElementById(id);

// --- Звуки: синтезируем через Web Audio, файлы не нужны ---
let actx = null;
function tone(freq, start, dur, type = "sine", vol = 0.07) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, actx.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, actx.currentTime + start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + start + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur + 0.05);
}
function sfx(name) {
  if (!soundOn) return;
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch(e) { return; }
  const S = {
    night:   () => { tone(300,0,.5,"sine",.08); tone(200,.18,.6,"sine",.07); tone(140,.4,.9,"sine",.06); },
    day:     () => { tone(392,0,.28); tone(523,.12,.28); tone(659,.24,.45,"sine",.08); },
    zeronight:() => { tone(220,0,.5,"triangle",.06); tone(165,.25,.7,"triangle",.06); },
    voting:  () => { tone(660,0,.12,"square",.05); tone(880,.14,.18,"square",.05); },
    allraise:() => { tone(523,0,.15,"square",.05); tone(523,.18,.15,"square",.05); tone(700,.36,.3,"square",.06); },
    death:   () => { tone(180,0,.5,"sawtooth",.07); tone(90,.12,.8,"sine",.08); },
    morning: () => { tone(523,0,.2); tone(587,.12,.2); tone(784,.26,.5,"sine",.08); },
    check:   () => { tone(880,0,.12,"sine",.06); tone(1175,.13,.25,"sine",.06); },
    winRed:  () => { [523,659,784,1047].forEach((f,i)=>tone(f,i*.14,.5,"sine",.09)); },
    winBlack:() => { [392,349,294,196].forEach((f,i)=>tone(f,i*.16,.6,"sawtooth",.07)); },
    winManiac:()=> { [440,466,554,740].forEach((f,i)=>tone(f,i*.13,.5,"square",.06)); },
    lastword:() => { tone(330,0,.3,"triangle",.06); tone(247,.2,.5,"triangle",.06); },
    tick:    () => { tone(1000,0,.06,"square",.04); }
  };
  (S[name] || (()=>{}))();
}
function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem("sound", soundOn ? "on" : "off");
  $("soundBtn").textContent = soundOn ? "🔊" : "🔇";
  if (soundOn) sfx("check");
}

function toggleCode() {
  codeShown = !codeShown;
  const el = $("roomCode");
  el.className = "code-pill" + (codeShown ? "" : " hidden-code");
  el.textContent = codeShown ? room.code : "👁 показать код";
}

// --- Аккаунты ---
let authMode = "login", myNick = "";

function authTab(mode) {
  authMode = mode;
  $("tabLogin").className = "preset-btn" + (mode === "login" ? " on" : "");
  $("tabReg").className = "preset-btn" + (mode === "reg" ? " on" : "");
  $("authNick").style.display = mode === "reg" ? "block" : "none";
  $("authBtn").textContent = mode === "reg" ? "Создать аккаунт" : "Войти";
  $("authPass").autocomplete = mode === "reg" ? "new-password" : "current-password";
  $("authErr").textContent = "";
}

async function doAuth() {
  const email = $("authEmail").value.trim();
  const pass = $("authPass").value;
  const nickname = $("authNick").value.trim();
  if (!email || !pass) { $("authErr").textContent = "Заполни почту и пароль"; return; }
  if (authMode === "reg" && nickname.length < 2) { $("authErr").textContent = "Придумай никнейм (от 2 символов)"; return; }
  $("authBtn").disabled = true;
  try {
    if (authMode === "reg") {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { nickname } } });
      if (error) throw error;
      if (!data.session) { $("authErr").textContent = "Проверь почту — нужно подтвердить адрес"; return; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
    }
    await afterLogin();
  } catch (e) {
    $("authErr").textContent = ruAuthErr(e.message || String(e));
  } finally { $("authBtn").disabled = false; }
}

function ruAuthErr(m) {
  if (/Invalid login/i.test(m)) return "Неверная почта или пароль";
  if (/already registered/i.test(m)) return "Такой аккаунт уже есть — войди";
  if (/Password should be/i.test(m)) return "Пароль слишком короткий (минимум 6)";
  if (/Unable to validate email/i.test(m) || /invalid format/i.test(m)) return "Проверь адрес почты";
  if (/rate limit/i.test(m)) return "Слишком много попыток, подожди минуту";
  return m;
}

async function googleAuth() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: location.origin + location.pathname + location.search }
  });
  if (error) $("authErr").textContent = "Google-вход не настроен: " + error.message;
}

async function signOut() {
  if (room) await leave();
  await sb.auth.signOut();
  me = null; myNick = "";
  $("homeView").style.display = "none";
  $("authView").style.display = "block";
}

async function afterLogin() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return false;
  me = data.session.user;
  const { data: prof } = await sb.rpc("my_profile");
  myNick = (prof && prof.nickname) || "";
  if (!myNick) {
    const n = prompt("Придумай никнейм для игры:", "");
    if (n && n.trim().length >= 2) {
      const { data: r } = await sb.rpc("set_nickname", { p_nick: n.trim() });
      myNick = (r && r.nickname) || n.trim();
    } else { myNick = "Игрок"; await sb.rpc("set_nickname", { p_nick: myNick }); }
  }
  $("nickname").value = myNick;
  $("meNick").textContent = myNick;
  $("authView").style.display = "none";
  $("homeView").style.display = "block";
  const invite = new URLSearchParams(location.search).get("r");
  if (invite && !room) { $("joinCode").value = invite.toUpperCase(); join(invite); }
  return true;
}

async function changeNick() {
  const n = prompt("Новый никнейм:", myNick);
  if (!n || n.trim().length < 2) return;
  const { data } = await sb.rpc("set_nickname", { p_nick: n.trim() });
  if (data && data.error) { alert("Не вышло: " + data.error); return; }
  myNick = data.nickname; $("meNick").textContent = myNick; $("nickname").value = myNick;
}

async function ensureAuth() {
  const { data } = await sb.auth.getSession();
  if (!data.session) throw new Error("Нужно войти в аккаунт");
  me = data.session.user;
}
function nick() {
  return myNick || $("nickname").value.trim() || "Игрок";
}
async function create() {
  const n = nick(); if (!n) return;
  try { await ensureAuth();
    const { data, error } = await sb.rpc("create_room", { p_nickname:n, p_mode:$("mode").value });
    if (error || data.error) throw new Error(error?.message || data.error);
    enterRoom({ room_id:data.room_id, code:data.code, mode:$("mode").value });
  } catch(e){ $("homeErr").textContent = e.message; }
}
async function join(codeArg) {
  const n = nick(); if (!n) return;
  const code = (codeArg || $("joinCode").value).trim().toUpperCase();
  if (code.length !== 6) { $("homeErr").textContent = "Код — 6 символов"; return; }
  try { await ensureAuth();
    const { data, error } = await sb.rpc("join_room", { p_code:code, p_nickname:n });
    if (error) throw new Error(error.message);
    if (data.error === "not_found") throw new Error("Комната не найдена");
    if (data.error === "full") throw new Error("Комната заполнена");
    if (data.error) throw new Error(data.error);
    enterRoom(data);
  } catch(e){ $("homeErr").textContent = e.message; }
}

async function enterRoom(r) {
  room = r;
  history.replaceState(null, "", "?r=" + r.code);
  $("homeView").style.display = "none";
  $("roomView").style.display = "block";
  codeShown = false;
  $("roomCode").className = "code-pill hidden-code";
  $("roomCode").textContent = "👁 показать код";
  $("soundBtn").textContent = soundOn ? "🔊" : "🔇";
  $("roomMode").textContent = r.mode === "host" ? "живой ведущий" : "автоведущий";
  await loadPreset();
  await refreshPlayers();
  subscribe();
  connectVideo();
  await checkGame();
  tickTimer = setInterval(gameTick, 5000);
  clockTimer = setInterval(renderClock, 1000);
}

async function refreshPlayers() {
  const { data } = await sb.from("room_players").select("*").eq("room_id", room.room_id).order("joined_at");
  players = data || [];
  render();
  renderSettings();
}

// --- Настройки лобби ---
async function loadPreset() {
  const { data } = await sb.from("rooms").select("preset").eq("id", room.room_id).limit(1);
  preset = (data && data[0] && data[0].preset && Object.keys(data[0].preset).length) ? data[0].preset
         : JSON.parse(JSON.stringify(PRESETS.yard));
  renderSettings();
}
async function savePreset() {
  const { data, error } = await sb.rpc("update_room_preset", { p_room: room.room_id, p_preset: preset });
  if (error || (data && data.error)) { alert("Настройки не сохранились: " + (error?.message || data.error)); return; }
  if (data && data.preset) preset = data.preset;
  renderSettings();
}
function applyPreset(key) { preset = JSON.parse(JSON.stringify(PRESETS[key])); savePreset(); sfx("check"); }
function setField(path, value) {
  if (path.startsWith("roles.")) preset.roles[path.slice(6)] = value;
  else preset[path] = value;
  preset.kind = "custom"; preset.name = preset.name && preset.name !== "Своя" ? preset.name : "Своя";
  const match = Object.entries(PRESETS).find(([k, p]) => JSON.stringify({...p, name:0, kind:0}) === JSON.stringify({...preset, name:0, kind:0}));
  if (match) { preset.kind = match[0]; preset.name = match[1].name; }
  savePreset();
}

function renderSettings() {
  if (!room || !preset) return;
  const box = $("settingsBox");
  const inLobby = !game || game.winner;
  box.style.display = inLobby ? "block" : "none";
  $("presetName").textContent = "— " + (preset.name || "Своя");
  const host = !!amHost();
  $("settingsHost").style.display = host ? "block" : "none";
  $("settingsRO").style.display = host ? "none" : "block";

  if (!host) {
    $("settingsRO").innerHTML = settingsSummary();
    return;
  }
  $("presetRow").innerHTML = Object.entries(PRESETS).map(([k, p]) =>
    `<button class="preset-btn ${preset.kind === k ? "on" : ""}" onclick="applyPreset('${k}')">${p.name}</button>`).join("")
    + `<button class="preset-btn ${!PRESETS[preset.kind] ? "on" : ""}" disabled>Своя</button>`;

  const num = (label, path, min, max) =>
    `<label>${label}<input type="number" min="${min}" max="${max}" value="${preset[path]}"
      onchange="setField('${path}', Math.max(${min}, Math.min(${max}, +this.value)))"></label>`;
  const chk = (label, path, val) =>
    `<label>${label}<input type="checkbox" ${val ? "checked" : ""} onchange="setField('${path}', this.checked)"></label>`;

  $("setGrid").innerHTML = [
    chk("Дон", "roles.don", preset.roles.don),
    chk("Шериф", "roles.sheriff", preset.roles.sheriff),
    chk("Доктор (от 8 игроков)", "roles.doctor", preset.roles.doctor),
    chk("Маньяк (от 6)", "roles.maniac", preset.roles.maniac),
    chk("Любовница (от 6)", "roles.lover", preset.roles.lover),
    num("День, сек на игрока", "day_seconds_per_player", 15, 180),
    num("Ночь, сек на роль", "night_step_seconds", 10, 120),
    num("Последнее слово, сек", "last_word_seconds", 10, 180),
    num("Нулевая ночь, сек", "zero_night_seconds", 10, 180),
    chk("Можно выставлять себя", "can_nominate_self", preset.can_nominate_self),
    chk("Мафия может стрелять в воздух", "allow_mafia_skip_shot", preset.allow_mafia_skip_shot),
    chk("Пропускать нулевую ночь", "skip_zero_night", preset.skip_zero_night),
    `<label>При ничьей<select onchange="setField('tie', this.value)">` +
      Object.entries(TIE_RU).map(([k, v]) => `<option value="${k}" ${preset.tie === k ? "selected" : ""}>${v}</option>`).join("") +
      `</select></label>`
  ].join("");
  updateCompPreview();
}

function settingsSummary() {
  const on = Object.entries(preset.roles).filter(([, v]) => v).map(([k]) => ROLE_SHORT[k]).join(", ");
  return `<b>${preset.name}</b><br>роли: ${on || "только мафия"}<br>` +
    `день ${preset.day_seconds_per_player}с/игрока · ночь ${preset.night_step_seconds}с/роль · последнее слово ${preset.last_word_seconds}с<br>` +
    `ничья: ${TIE_RU[preset.tie]}${preset.can_nominate_self ? " · можно выставлять себя" : ""}` +
    `${preset.allow_mafia_skip_shot ? " · выстрел в воздух" : ""}${preset.skip_zero_night ? " · без нулевой ночи" : ""}`;
}

async function updateCompPreview() {
  const n = room.mode === "host" ? players.filter(p => !p.is_host).length : players.length;
  if (n < 4) { $("compPreview").textContent = `Нужно минимум 4 игрока (сейчас ${n})`; return; }
  const { data } = await sb.rpc("compose_roles", { n, p: preset });
  if (!data) return;
  const counts = {};
  data.forEach(r => counts[r] = (counts[r] || 0) + 1);
  $("compPreview").innerHTML = `<b>Состав на ${n} игроков:</b> ` +
    Object.entries(counts).map(([r, c]) => `${ROLE_SHORT[r]}${c > 1 ? " ×" + c : ""}`).join(", ");
}

function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("room:" + room.room_id)
    .on("postgres_changes",{event:"*",schema:"public",table:"room_players",filter:"room_id=eq."+room.room_id}, refreshPlayers)
    .on("postgres_changes",{event:"*",schema:"public",table:"online_games",filter:"room_id=eq."+room.room_id}, p => { if (p.new?.id) onGame(p.new); })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"id=eq."+room.room_id}, p => {
      if (p.new.preset) { preset = p.new.preset; renderSettings(); }
      if (p.new.status === "finished" && !game) { alert("Комната закрыта"); leave(true); }
    })
    .subscribe();
}

async function checkGame() {
  const { data } = await sb.from("online_games").select("*").eq("room_id", room.room_id)
    .order("created_at",{ascending:false}).limit(1);
  if (data && data[0]) onGame(data[0]);
}

async function onGame(g) {
  const isNew = !game || game.id !== g.id;
  const phaseChanged = !game || game.phase !== g.phase;
  game = g;
  if (isNew) { roleShown = false; myActions = {}; mafiaMarks = {}; botDone = {}; lastDeaths = 0;
    bots.forEach(b => b.role = null);
    if (g.preset) preset = g.preset;
    await fetchSeats(); await fetchRole();
  }
  if (phaseChanged) { myActions = {}; mafiaMarks = {}; applyAV(); await fetchSeats();
    if (g.phase === "morning") fetchNightResult();
    sfx(g.phase === "finished" ? ({red:"winRed", black:"winBlack", maniac:"winManiac"}[g.winner] || "winRed") : g.phase);
  }
  const deaths = (g.state.deaths || []).length;
  if (deaths > lastDeaths) { if (!phaseChanged || g.phase === "morning" || g.phase === "lastword") sfx("death"); }
  lastDeaths = deaths;
  render();
}

async function fetchSeats() {
  if (!game) return;
  const { data } = await sb.from("online_seats").select("*").eq("game_id", game.id).order("seat");
  seatsG = data || [];
}
function amNarrator() { return room.mode === "host" && amHost() && !mySeat(); }

async function fetchRole() {
  if (amNarrator()) { roleShown = true; await fetchHostRoles(); return; }
  const { data } = await sb.rpc("my_role", { p_game: game.id });
  if (data && data.role) { myRole = data; if (!roleShown) showRole(); }
}
async function fetchHostRoles() {
  const { data } = await sb.from("online_roles").select("uid,role").eq("game_id", game.id);
  hostRoles = {}; (data || []).forEach(r => hostRoles[r.uid] = r.role);
}
let lastCheck = "";
async function fetchNightResult() {
  const { data } = await sb.rpc("my_night_result", { p_game: game.id });
  if (!data || !data.length) return;
  const last = data.filter(r => r.day === game.day_number);
  lastCheck = last.map(r => {
    const t = seatsG.find(s => s.uid === r.target);
    const who = t ? t.nickname : "?";
    if (r.kind === "sheriff_check") return `Проверка: ${who} — ` + (r.result.is_black ? '<span class="black">ЧЁРНЫЙ ⬛</span>' : '<span class="red">красный 🟥</span>');
    if (r.kind === "don_check") return `Проверка: ${who} — ` + (r.result.is_sheriff ? '<span class="black">ШЕРИФ ⭐</span>' : "не шериф");
    return "";
  }).join("<br>");
  render();
}

function showRole() {
  roleShown = true;
  const [name, emoji, desc] = ROLE_RU[myRole.role] || [myRole.role,"❓",""];
  $("roleEmoji").textContent = emoji;
  $("roleName").textContent = name;
  $("roleDesc").textContent = desc;
  const tl = $("teamList");
  if (myRole.team && myRole.team.length) {
    tl.style.display = "block";
    tl.innerHTML = "<b>Твоя команда:</b><br>" + myRole.team.map(t => `#${t.seat} ${t.nickname} (${ROLE_RU[t.role][0]})`).join("<br>");
  } else tl.style.display = "none";
  $("roleOverlay").style.display = "flex";
}
function closeRole() {
  $("roleOverlay").style.display = "none";
  if (game && game.phase === "reveal") sendReady();
}

async function startGame() {
  const { data, error } = await sb.rpc("start_game", { p_room: room.room_id });
  if (error || data.error) alert("Не удалось начать: " + (error?.message || data.error));
}
async function sendReady() {
  myActions.ready = true; render();
  await sb.rpc("act", { p_game: game.id, p_kind: "ready" });
}
async function hostNext() { await sb.rpc("host_next", { p_game: game.id }); }
async function airShot() {
  const { data } = await sb.rpc("act", { p_game: game.id, p_kind: "mafia_kill", p_target: null });
  if (data && data.error) { $("phaseSub").textContent = "⚠ " + ruErr(data.error); return; }
  myActions.mafia_kill = "air"; sfx("tick"); render();
}
async function raise(yes) {
  const { data } = await sb.rpc("act", { p_game: game.id, p_kind: yes ? "raise_yes" : "raise_no" });
  if (data && data.error) { $("phaseSub").textContent = "⚠ " + ruErr(data.error); return; }
  myActions.raise = yes ? "yes" : "no"; sfx("tick"); render();
}
function toggleDonMode() {
  donMode = donMode === "kill" ? "check" : "kill"; render();
}
async function gameTick() {
  if (!game || game.winner) return;
  await sb.rpc("tick", { p_game: game.id });
  const { data } = await sb.from("online_games").select("*").eq("id", game.id);
  if (data && data[0]) onGame(data[0]);
  if (game.phase === "night" && myRole && ["mafia","don"].includes(myRole.role)) fetchMafiaMarks();
}
async function fetchMafiaMarks() {
  const { data } = await sb.from("online_actions").select("uid,target")
    .eq("game_id", game.id).eq("kind","mafia_kill").eq("day", game.day_number).eq("phase","night");
  mafiaMarks = {};
  (data||[]).forEach(a => { if (a.target) mafiaMarks[a.target] = (mafiaMarks[a.target]||0)+1; });
  render();
}

function mySeat() { return seatsG.find(s => s.uid === me.id); }
function alive(uid) { const s = seatsG.find(x => x.uid === uid); return s && s.alive; }
function amHost() { return players.find(p => p.uid === me.id && p.is_host); }

async function tileClick(uid) {
  if (!game || game.winner || uid === me.id && game.phase !== "night") {}
  const my = mySeat();
  if (!my || !my.alive) return;
  let kind = null;
  if (game.phase === "day" && uid !== me.id) kind = "nominate";
  else if (game.phase === "voting") kind = "vote";
  else if (game.phase === "night" && myRole) {
    const r = myRole.role;
    if (r === "mafia") kind = "mafia_kill";
    else if (r === "don") kind = donMode === "kill" ? "mafia_kill" : "don_check";
    else if (r === "sheriff") kind = "sheriff_check";
    else if (r === "doctor") kind = "doctor_heal";
    else if (r === "maniac") kind = "maniac_kill";
    else if (r === "lover") kind = "lover_block";
  }
  if (!kind) return;
  const { data } = await sb.rpc("act", { p_game: game.id, p_kind: kind, p_target: uid });
  if (data && data.error) { $("phaseSub").textContent = "⚠ " + ruErr(data.error); return; }
  myActions[kind] = uid; render();
  if (kind === "mafia_kill") fetchMafiaMarks();
}
function ruErr(e) {
  return { self:"Себя выставить нельзя (настройка выключена)", same_heal:"Нельзя лечить одного дважды подряд",
    not_candidate:"Голосовать можно только за кандидата", bad_target:"Цель недоступна",
    wrong_phase:"Не та фаза", forbidden:"Недоступно твоей роли", dead:"Ты выбыл",
    skip_not_allowed:"Выстрел в воздух запрещён настройками", self_heal_used:"Себя можно лечить только раз за игру" }[e] || e;
}

function applyAV() {
  if (!lk.room || !lk.connected || !game) return;
  const my = mySeat();
  // ведущий говорит всегда — он ведёт и ночь тоже
  const mic = amNarrator() || (my && my.alive && game.phase !== "night" && !game.winner);
  lk.room.localParticipant.setMicrophoneEnabled(!!mic).catch(()=>{});
}

function renderClock() {
  if (!game || !game.deadline || game.winner) { $("timer").textContent = ""; return; }
  const left = Math.max(0, Math.floor((new Date(game.deadline) - Date.now()) / 1000));
  $("timer").textContent = Math.floor(left/60) + ":" + String(left%60).padStart(2,"0");
  $("timer").className = "timer" + (left <= 10 ? " low" : "");
}

const NARRATOR_HINT = {
  reveal:"Игроки смотрят роли. Когда все готовы — жми «Следующая фаза»",
  day:"Веди обсуждение. Игроки выставляют кандидатов, ты переводишь на голосование",
  voting:"Игроки голосуют — фаза закроется сама, когда проголосуют все",
  lastword:"Последнее слово выбывшего, затем «Следующая фаза»",
  night:"Ночь: буди роли по очереди. Ночь закроется сама, когда все сходят",
  morning:"Объяви итоги ночи и переводи в день"
};

function phaseHint() {
  if (amNarrator()) return NARRATOR_HINT[game.phase] || "Ты ведущий — управляй фазами";
  const my = mySeat();
  if (!my) return "";
  if (!my.alive && game.phase !== "finished") return "Ты выбыл — наблюдай молча 🤫";
  const r = myRole ? myRole.role : "civilian";
  switch (game.phase) {
    case "reveal": return "Посмотри свою роль и нажми «Готов»";
    case "zeronight":
      return ["mafia","don"].includes(r)
        ? "Нулевая ночь: мафия знакомится 🤝 — твоя команда подсвечена"
        : "Нулевая ночь — мафия знакомится. Закрой глаза 😴";
    case "allraise":
      return "Подъём всех: голосуем, уезжают ли оба кандидата. Больше половины «за» — уезжают";
    case "day": return "Обсуждайте! Клик по игроку — выставить на голосование";
    case "voting": return "Тайное голосование: клик по кандидату с оранжевой рамкой";
    case "lastword": {
      const lw = seatsG.find(s => s.uid === game.state.lastword);
      return lw && lw.uid === me.id ? "Твоё последнее слово!" : `Последнее слово: ${lw ? lw.nickname : ""}`;
    }
    case "night":
      if (r === "mafia") return "Выбери жертву 🔫 (клик по игроку)";
      if (r === "don") return donMode === "kill" ? "Режим: выстрел 🔫 — клик по жертве" : "Режим: проверка на шерифа 🔍";
      if (r === "sheriff") return "Кого проверить? 🔍";
      if (r === "doctor") return "Кого лечить? 💉";
      if (r === "maniac") return "Твоя жертва? 🔪";
      if (r === "lover") return "Кого заблокировать? 💋";
      return "Город спит… не подсматривай 😴";
    case "morning": return "Итоги ночи. Нажми «Готов», чтобы продолжить";
    default: return "";
  }
}

function render() {
  const grid = $("playersGrid");
  const inGame = game && !["finished"].includes(game.phase) && !game.winner;
  // в режиме живого ведущего сам ведущий за стол не садится
  const seated = room.mode === "host" ? players.filter(p => !p.is_host).length : players.length;
  const inLobby = (!game || game.winner) && amHost();
  $("botBtn").style.display = inLobby && players.length < 12 ? "block" : "none";
  $("botBtn").textContent = bots.length ? `🤖 Ещё бот (${bots.length})` : "🤖 Добавить бота (тест в одиночку)";
  $("startBtn").style.display = inLobby ? "block" : "none";
  $("startBtn").disabled = seated < 4;
  $("startBtn").textContent = seated < 4 ? `Начать игру (нужно 4 игрока, есть ${seated})` : "Начать игру";

  if (game) {
    $("gamePanel").style.display = "block";
    $("phaseTitle").textContent = (PHASE_TITLE[game.phase] || game.phase) + (game.phase !== "reveal" && !game.winner ? " · день " + game.day_number : "");
    $("phaseSub").innerHTML = game.phase === "morning" && lastCheck ? lastCheck : phaseHint();
  } else $("gamePanel").style.display = "none";

  const my = mySeat();
  const readyPhases = ["day","morning","zeronight"];
  const showReady = !amNarrator() && (inGame && my && my.alive && readyPhases.includes(game.phase) && !myActions.ready
    || inGame && game.phase === "lastword" && game.state.lastword === me.id);
  $("readyBtn").style.display = showReady ? "block" : "none";
  $("readyBtn").textContent = game && game.phase === "day" ? "Завершить обсуждение" :
    game && game.phase === "lastword" ? "Закончить речь" : "Готов";
  $("hostNextBtn").style.display = inGame && room.mode === "host" && amHost() ? "block" : "none";
  $("donModeBtn").style.display = inGame && game.phase === "night" && myRole && myRole.role === "don" ? "block" : "none";
  $("donModeBtn").textContent = donMode === "kill" ? "🔫 Выстрел (сменить на проверку)" : "🔍 Проверка (сменить на выстрел)";
  const canAir = inGame && game.phase === "night" && my && my.alive && myRole
    && ["mafia","don"].includes(myRole.role) && (myRole.role === "mafia" || donMode === "kill")
    && preset && preset.allow_mafia_skip_shot;
  $("airShotBtn").style.display = canAir ? "block" : "none";
  $("airShotBtn").textContent = myActions.mafia_kill === "air" ? "💨 Выстрел в воздух ✓" : "💨 Выстрел в воздух";
  const inRaise = inGame && game.phase === "allraise" && my && my.alive;
  $("raiseYesBtn").style.display = inRaise ? "block" : "none";
  $("raiseNoBtn").style.display = inRaise ? "block" : "none";
  $("raiseYesBtn").textContent = myActions.raise === "yes" ? "✋ За ✓" : "✋ Поднять руку — за";
  $("raiseNoBtn").textContent = myActions.raise === "no" ? "Против ✓" : "Против";

  let list = inGame || (game && game.winner) ? seatsG : players.map(p => ({uid:p.uid, nickname:p.nickname, alive:true, seat:null, is_host:p.is_host}));
  if (game && room.mode === "host") {
    // тайл ведущего рядом со столом — чтобы его видео и голос были на виду
    const narrator = players.find(p => p.is_host && !seatsG.some(s => s.uid === p.uid));
    if (narrator) list = [{uid:narrator.uid, nickname:narrator.nickname, alive:true, seat:null, narrator:true}, ...list];
  }
  const noms = game ? (game.state.nominations || []) : [];
  const cands = game ? (game.state.candidates || []) : [];
  grid.innerHTML = list.map(p => {
    const host = players.find(x => x.uid === p.uid && x.is_host);
    const badges = [];
    if (p.narrator) badges.push('<span class="badge nom">ведущий 🎙</span>');
    if (game && game.phase === "zeronight" && myRole && myRole.team &&
        myRole.team.some(t => t.nickname === p.nickname && t.seat === p.seat)) {
      badges.push('<span class="badge mafi">🤝 своя</span>');
    }
    if (amNarrator() && hostRoles[p.uid]) {
      const rr = ROLE_RU[hostRoles[p.uid]] || ["?","❓"];
      badges.push(`<span class="badge ${["mafia","don"].includes(hostRoles[p.uid]) ? "mafi" : "vote"}">${rr[1]} ${rr[0]}</span>`);
    }
    if (game && !game.winner) {
      if (game.phase === "day" && noms.includes(p.uid)) badges.push('<span class="badge nom">выставлен</span>');
      if (game.phase === "voting" && myActions.vote === p.uid) badges.push('<span class="badge vote">твой голос ✓</span>');
      if (game.phase === "night" && mafiaMarks[p.uid]) badges.push(`<span class="badge mafi">🔫 ${mafiaMarks[p.uid]}</span>`);
      if (["mafia_kill","don_check","sheriff_check","doctor_heal","maniac_kill","lover_block"].some(k => myActions[k] === p.uid))
        badges.push('<span class="badge vote">выбор ✓</span>');
    }
    const cls = ["tile"];
    if (!p.alive) cls.push("dead");
    if (p.uid === me.id) cls.push("me");
    if (game && game.phase === "voting" && cands.includes(p.uid)) cls.push("candidate");
    const clickable = inGame && my && my.alive && p.alive && (
      (game.phase === "day" && p.uid !== me.id) ||
      (game.phase === "voting" && cands.includes(p.uid)) ||
      (game.phase === "night"));
    if (clickable) cls.push("clickable");
    return `<div class="${cls.join(" ")}" id="tile-${p.uid}" ${clickable ? `onclick="tileClick('${p.uid}')"` : ""}>
      <div class="ph">${(p.nickname||"?").slice(0,1).toUpperCase()}</div>
      <div class="badges">${badges.join("")}</div>
      <div class="name">${host ? '<span class="crown">♛</span> ' : ""}${p.seat ? "#"+p.seat+" " : ""}${p.nickname}${p.uid===me.id?" (ты)":""}</div>
    </div>`;
  }).join("");
  if (lk.connected) attachAllTracks();
  $("settingsBox").style.display = (!game || game.winner) ? "block" : "none";

  if (game && game.winner) showEnd();
}

async function showEnd() {
  const win = { red:["🟥","Победа мирных!"], black:["⬛","Победа мафии!"], maniac:["🔪","Победил маньяк!"] }[game.winner] || ["🏁","Игра окончена"];
  $("endEmoji").textContent = win[0];
  $("endTitle").textContent = win[1];
  const { data: roles } = await sb.from("online_roles").select("uid,role").eq("game_id", game.id);
  const rmap = {}; (roles||[]).forEach(r => rmap[r.uid] = r.role);
  $("endRoles").innerHTML = seatsG.map(s =>
    `#${s.seat} ${s.nickname} — ${(ROLE_RU[rmap[s.uid]]||["?"])[0]} ${s.alive ? "" : "☠"}`).join("<br>");
  $("endOverlay").style.display = "flex";
}

function copyLink() {
  navigator.clipboard.writeText(location.origin + location.pathname + "?r=" + room.code);
  $("copyBtn").textContent = "Скопировано ✓";
  setTimeout(()=>$("copyBtn").textContent="Пригласить", 1500);
}
async function leave(silent) {
  if (bots.length) await dismissBots();
  try { if (!silent) await sb.rpc("leave_room", { p_room: room.room_id }); } catch(e){}
  if (lk.room) { lk.room.disconnect(); lk.room = null; lk.connected = false; }
  if (channel) sb.removeChannel(channel);
  clearInterval(tickTimer); clearInterval(clockTimer);
  room = null; game = null; myRole = null;
  history.replaceState(null, "", location.pathname);
  $("roomView").style.display = "none";
  $("homeView").style.display = me ? "block" : "none";
  $("authView").style.display = me ? "none" : "block";
}

async function connectVideo() {
  let data, error;
  try { ({ data, error } = await sb.rpc("livekit_token", { p_room: room.room_id })); }
  catch (e) { error = e; }
  if (error || !data || !data.token) {
    $("videoHint").textContent = "Видео недоступно — играйте с созвоном в Discord.";
    return;
  }
  try {
    lk.room = new LivekitClient.Room({ adaptiveStream:true, dynacast:true });
    await lk.room.connect(data.url, data.token);
    await lk.room.localParticipant.enableCameraAndMicrophone();
    lk.connected = true;
    $("videoHint").textContent = "";
    lk.room.on("trackSubscribed", attachAllTracks);
    lk.room.on("participantConnected", attachAllTracks);
    attachAllTracks(); applyAV();
  } catch (e) {
    $("videoHint").textContent = "Видео: " + e.message;
  }
}
function attachTrackTo(uid, participant) {
  const tile = document.getElementById("tile-" + uid);
  if (!tile) return;
  participant.videoTrackPublications.forEach(pub => {
    if (pub.track && !tile.querySelector("video")) {
      tile.prepend(pub.track.attach());
      tile.querySelector(".ph").style.display = "none";
    }
  });
  participant.audioTrackPublications.forEach(pub => {
    if (pub.track && !participant.isLocal) pub.track.attach();
  });
}
function attachAllTracks() {
  if (!lk.room) return;
  attachTrackTo(me.id, lk.room.localParticipant);
  lk.room.remoteParticipants.forEach(p => attachTrackTo(p.identity, p));
}

// --- Боты: чтобы можно было протестировать игру в одиночку ---
const BOT_NAMES = ["Бот Аня","Бот Гриша","Бот Дима","Бот Женя","Бот Костя","Бот Лиза",
                   "Бот Марк","Бот Оля","Бот Петя","Бот Рита","Бот Саша","Бот Тимур"];
let bots = [], botTimer = null, botDone = {};

async function addBot() {
  const btn = $("botBtn"); btn.disabled = true;
  try {
    const c = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
      { auth: { persistSession:false, autoRefreshToken:false } });
    const { data, error } = await c.auth.signInAnonymously();
    if (error) throw error;
    const name = BOT_NAMES[bots.length % BOT_NAMES.length];
    const { data: j, error: je } = await c.rpc("join_room", { p_code: room.code, p_nickname: name });
    if (je) throw je;
    if (j && j.error) throw new Error(j.error);
    bots.push({ c, uid: data.user.id, name, role: null });
    await refreshPlayers();
    if (!botTimer) botTimer = setInterval(runBots, 2500);
  } catch (e) { alert("Бот не добавился: " + (e.message || e)); }
  btn.disabled = false;
}

async function runBots() {
  if (!bots.length || !game || game.winner) return;
  const stamp = `${game.id}|${game.phase}|${game.day_number}`;
  const seatOf = uid => seatsG.find(s => s.uid === uid);
  const isAlive = uid => { const s = seatOf(uid); return !s || s.alive; };
  const pick = a => a[Math.floor(Math.random() * a.length)];

  for (const b of bots) {
    if (botDone[b.uid] === stamp) continue;
    if (!b.role) {
      const { data } = await b.c.rpc("my_role", { p_game: game.id });
      if (data && data.role) b.role = data.role;
    }
    if (!isAlive(b.uid)) { botDone[b.uid] = stamp; continue; }
    const act = (kind, target) => b.c.rpc("act", { p_game: game.id, p_kind: kind, p_target: target || null });
    const others = seatsG.filter(s => s.alive && s.uid !== b.uid);
    try {
      if (game.phase === "reveal" || game.phase === "zeronight") await act("ready");
      else if (game.phase === "allraise") await act(Math.random() < 0.5 ? "raise_yes" : "raise_no");
      else if (game.phase === "day") {
        if (others.length && Math.random() < 0.45) await act("nominate", pick(others).uid);
        await act("ready");
      } else if (game.phase === "voting") {
        const cands = (game.state.candidates || []).filter(isAlive);
        if (cands.length) await act("vote", pick(cands));
      } else if (game.phase === "lastword") {
        if (game.state.lastword === b.uid) await act("ready");
      } else if (game.phase === "morning") await act("ready");
      else if (game.phase === "night" && others.length) {
        const t = pick(others).uid;
        if (b.role === "mafia") await act("mafia_kill", t);
        else if (b.role === "don") { await act("mafia_kill", t); await act("don_check", t); }
        else if (b.role === "sheriff") await act("sheriff_check", t);
        else if (b.role === "doctor") await act("doctor_heal", t);
        else if (b.role === "maniac") await act("maniac_kill", t);
        else if (b.role === "lover") await act("lover_block", t);
      }
    } catch (e) {}
    botDone[b.uid] = stamp;
  }
  gameTick();
}

async function dismissBots() {
  clearInterval(botTimer); botTimer = null;
  for (const b of bots) { try { await b.c.rpc("leave_room", { p_room: room.room_id }); } catch(e){} }
  bots = []; botDone = {};
}

const inviteCode = new URLSearchParams(location.search).get("r");
if (inviteCode) $("joinCode").value = inviteCode.toUpperCase();
authTab("login");
sb.auth.getSession().then(({ data }) => { if (data.session) afterLogin(); });
sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_IN" && !me) afterLogin(); });
